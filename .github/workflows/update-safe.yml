name: Atualizar Auto Resposta seguro

on:
  push:
    paths:
      - '.github/workflows/update-safe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar versão segura
        shell: bash
        run: |
          rm -f app/src/main/java/com/gelado/autoresposta/AutoAnswerAccessibilityService.java
          rm -f app/src/main/res/xml/accessibility_service_config.xml
          echo '' | base64 -d | tar -xz

      - name: Salvar atualização no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza para versão segura com botão flutuante"
            git push
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-resposta-seguro-apk
          path: app/build/outputs/apk/debug/app-debug.apk
