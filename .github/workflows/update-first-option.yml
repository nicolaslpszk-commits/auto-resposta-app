name: Atualizar fallback primeira opção

on:
  push:
    paths:
      - '.github/workflows/update-first-option.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Aplicar fallback para primeira opção
        shell: bash
        run: |
          echo '' | base64 -d > app/src/main/java/com/gelado/autoresposta/ScreenCaptureService.java
          sed -i 's/versionCode 2/versionCode 3/' app/build.gradle || true
          sed -i 's/versionName "2.0"/versionName "2.1"/' app/build.gradle || true

      - name: Salvar atualização
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/gelado/autoresposta/ScreenCaptureService.java app/build.gradle
          if ! git diff --cached --quiet; then
            git commit -m "Usa primeira opção quando não houver resposta clara"
            git push
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-resposta-primeira-opcao-apk
          path: app/build/outputs/apk/debug/app-debug.apk
