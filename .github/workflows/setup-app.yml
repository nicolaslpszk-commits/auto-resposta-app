name: Montar e compilar Auto Resposta

on:
  push:
    paths:
      - '.github/workflows/setup-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Criar arquivos do projeto
        shell: bash
        run: |
          echo '' | base64 -d | tar -xz

      - name: Salvar projeto no repositório
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add settings.gradle build.gradle gradle.properties app README.md
          if ! git diff --cached --quiet; then
            git commit -m "Cria aplicativo Auto Resposta"
            git push
          fi

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-resposta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
